<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Stackly</title>
<meta name="description" content="Stackly is a luxury fashion atelier — bespoke tailoring, curated collections, and personal styling.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --header:#E8C5B5;
  --bg:#F6E9DC;
  --footer:#D9A99D;
  --text:#392B27;
  --accent:#A97867;
  --button:#795348;
  --gold:#C9A96E;
  --deep:#3D2A22;
  --line: rgba(61,48,50,0.14);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;overflow-x:hidden;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Jost',sans-serif;
  font-weight:300;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
::selection{background:var(--accent);color:#fff;}
a{text-decoration:none;color:inherit;}

.error-page{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8vh 6vw;
  position:relative;
  overflow:hidden;
}

/* decorative background rings */
.error-page::before{
  content:"";
  position:absolute;
  width:min(70vw,780px);
  height:min(70vw,780px);
  border:1px dashed var(--line);
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  animation:spin-slow 60s linear infinite;
}
.error-page::after{
  content:"";
  position:absolute;
  width:min(48vw,520px);
  height:min(48vw,520px);
  border:1px solid var(--line);
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  animation:spin-slow-reverse 45s linear infinite;
}

@keyframes spin-slow{
  from{transform:translate(-50%,-50%) rotate(0deg);}
  to{transform:translate(-50%,-50%) rotate(360deg);}
}
@keyframes spin-slow-reverse{
  from{transform:translate(-50%,-50%) rotate(0deg);}
  to{transform:translate(-50%,-50%) rotate(-360deg);}
}

/* entrance animations */
@keyframes fade-up{
  from{opacity:0;transform:translateY(28px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes float-num{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

.anim-in{
  opacity:0;
  animation:fade-up 0.9s cubic-bezier(.25,.8,.35,1) forwards;
}
.eyebrow.anim-in{animation-delay:0.1s;}
.error-code.anim-in{animation-delay:0.25s;}
.error-title.anim-in{animation-delay:0.45s;}
.error-text.anim-in{animation-delay:0.6s;}
.error-actions.anim-in{animation-delay:0.75s;}

.error-code em{
  display:inline-block;
  animation:float-num 3.4s ease-in-out infinite;
  animation-delay:1.4s;
}
.error-code span.digit{
  display:inline-block;
  animation:float-num 3.4s ease-in-out infinite;
}
.error-code span.digit:first-child{animation-delay:1.1s;}
.error-code span.digit:last-child{animation-delay:1.7s;}

@media (prefers-reduced-motion:reduce){
  .anim-in{animation:none;opacity:1;transform:none;}
  .error-page::before,.error-page::after,.error-code em,.error-code span.digit{animation:none;}
}

.error-inner{
  position:relative;
  z-index:2;
  text-align:center;
  max-width:640px;
  width:100%;
}

.eyebrow{
  font-size:0.72rem;letter-spacing:0.32em;text-transform:uppercase;
  color:var(--button);font-weight:500;display:inline-flex;align-items:center;gap:12px;
  margin-bottom:26px;
}
.eyebrow::before,.eyebrow::after{
  content:"";width:28px;height:1px;background:var(--button);display:inline-block;
}

.error-code{
  font-family:'Cormorant Garamond',serif;
  font-weight:500;
  font-size:clamp(5.5rem,18vw,11rem);
  line-height:0.9;
  color:var(--deep);
  letter-spacing:0.02em;
}
.error-code em{
  font-style:italic;
  color:var(--accent);
}

.error-title{
  font-family:'Cormorant Garamond',serif;
  font-weight:500;
  font-size:clamp(1.6rem,3.6vw,2.4rem);
  color:var(--deep);
  margin:18px 0 20px;
  letter-spacing:0.01em;
}

.error-text{
  font-size:1rem;
  line-height:1.75;
  color:var(--text);
  opacity:0.85;
  max-width:460px;
  margin:0 auto 44px;
  font-weight:300;
}

.error-actions{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
}

.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:16px 34px;border:1px solid var(--button);
  color:var(--button);font-size:0.78rem;letter-spacing:0.2em;text-transform:uppercase;
  position:relative;overflow:hidden;background:transparent;cursor:pointer;font-family:'Jost',sans-serif;
  transition:color .5s ease;
  min-width:190px;
  justify-content:center;
}
.btn span{position:relative;z-index:2;display:inline-flex;align-items:center;gap:10px;}
.btn svg{width:14px;height:14px;position:relative;z-index:2;flex-shrink:0;}
.btn::before{
  content:"";position:absolute;inset:0;background:var(--button);
  transform:translateY(101%);transition:transform .5s cubic-bezier(.65,0,.35,1);z-index:1;
}
.btn:hover{color:#fff;}
.btn:hover::before{transform:translateY(0);}
.btn.solid{background:var(--button);color:#fff;}
.btn.solid::before{background:var(--deep);}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}

/* Responsive tweaks */
@media (max-width:640px){
  .error-page{padding:10vh 7vw;}
  .error-actions{flex-direction:column;gap:16px;width:100%;}
  .btn{width:100%;max-width:320px;}
  .eyebrow{font-size:0.64rem;letter-spacing:0.26em;gap:8px;}
  .eyebrow::before,.eyebrow::after{width:18px;}
}

@media (max-width:380px){
  .error-code{font-size:clamp(4.2rem,22vw,6rem);}
}

@media (min-width:1600px){
  .error-inner{max-width:760px;}
}
</style>
</head>
<body>

<main class="error-page">
  <div class="error-inner">
    <span class="eyebrow anim-in">Stackly Atelier</span>
    <div class="error-code anim-in"><span class="digit">4</span><em>0</em><span class="digit">4</span></div>
    <h1 class="error-title anim-in">This Page Has Left the Collection</h1>
    <p class="error-text anim-in">The page you're looking for has been discontinued, moved, or never existed. Let's guide you back to something beautifully in style.</p>

    <div class="error-actions anim-in">
      <button type="button" class="btn" onclick="window.history.back()">
        <span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Go Back
        </span>
      </button>
      <a href="index.html" class="btn solid">
        <span>
          Go Home
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
        </span>
      </a>
    </div>
  </div>
</main>

</body>
</html>
